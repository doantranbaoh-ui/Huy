# --- render.yaml ---
services:
  # 1. Redis (Use Render's Redis or Upstash)
  # Create a Redis instance manually in Render dashboard

  # 2. Proxy Manager API
  - type: web
    name: nexus-proxy-manager
    runtime: python
    repo: https://github.com/yourusername/nexus-render
    plan: starter
    region: frankfurt
    buildCommand: cd proxy_manager && pip install -r requirements.txt
    startCommand: cd proxy_manager && uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: nexus-redis
          property: connectionString
      - key: PORT
        value: 8000

  # 3. Telegram Bot Worker
  - type: worker
    name: nexus-telegram-bot
    runtime: python
    repo: https://github.com/yourusername/nexus-render
    plan: starter
    region: frankfurt
    buildCommand: cd telegram_bot && pip install -r requirements.txt
    startCommand: cd telegram_bot && python bot.py
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: nexus-redis
          property: connectionString
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ALLOWED_USERS
        sync: false

  # 4. Keep-Alive Service
 
