services:
  - type: worker
    name: nexus-proxy-bot
    runtime: python
    plan: starter
    region: frankfurt
    buildCommand: pip install --prefer-binary -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: nexus-redis
          property: connectionString
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ALLOWED_USERS
        sync: false
      - key: SOC_WEBHOOK_URL
        sync: false
