# --- render.yaml (Fixed) ---
services:
  # 1. Proxy Manager API
  - type: web
    name: nexus-proxy-manager
    runtime: python
    plan: starter
    region: frankfurt
    buildCommand: |
      cd proxy_manager && \
      pip install --prefer-binary --no-cache-dir -r requirements.txt
    startCommand: cd proxy_manager && uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: nexus-redis
          property: connectionString
      - key: PORT
        value: 8000

  # 2. Telegram Bot Worker
  - type: worker
    name: nexus-telegram-bot
    runtime: python
    plan: starter
    region: frankfurt
    buildCommand: |
      cd telegram_bot && \
      pip install --prefer-binary --no-cache-dir -r requirements.txt
    startCommand: cd telegram_bot && python bot.py
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: nexus-redis
          property: connectionString
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ALLOWED_USERS
        sync: false

  # 3. Keep-Alive Service
  - type: worker
    name: nexus-keepalive
    runtime: python
    plan: starter
    region: frankfurt
    buildCommand: |
      cd keep_alive && \
      pip install --prefer-binary --no-cache-dir -r requirements.txt
    startCommand: cd keep_alive && python keepalive.py
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: nexus-redis
          property: connectionString
      - key: SOC_WEBHOOK_URL
        sync: false

  # 4. Health Check
  - type: web
    name: nexus-healthcheck
    runtime: python
    plan: starter
    region: frankfurt
    buildCommand: |
      cd health_check && \
      pip install --prefer-binary --no-cache-dir -r requirements.txt
    startCommand: cd health_check && uvicorn health:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: nexus-redis
          property: connectionString
      - key: PORT
        value: 8080
